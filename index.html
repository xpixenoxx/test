<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pixenox — HR Management Platform</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="Pixenox is an internal HR management platform for employee management, attendance tracking, leave management, and team operations.">
  <meta name="author" content="Pixenox">
  <meta name="robots" content="noindex, nofollow">

  <!-- PWA & iOS Specific Meta Tags -->
  <meta name="theme-color" content="#0f0f23">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pixenox">

  <!-- High Quality Icons for iOS -->
  <link rel="apple-touch-icon" href="/img/icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/img/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/img/icon-192.png">
  
  <link rel="icon" type="image/webp" href="/img/mobile-logo.webp">
  <link rel="manifest" href="/manifest.json">
  
  <link rel="preconnect" href="https://esm.sh" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script>
  // App is forced to light mode
  (function() {
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', '#fcfdfe');
  })();
</script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.3",
    "react-dom": "https://esm.sh/react-dom@19.2.3",
    "react-dom/client": "https://esm.sh/react-dom@19.2.3/client",
    "react/": "https://esm.sh/react@19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "recharts": "https://esm.sh/recharts@2.13.3"
  }
}
</script>
<link rel="modulepreload" href="https://esm.sh/react@19.2.3">
<link rel="modulepreload" href="https://esm.sh/react-dom@19.2.3/client">
</head>
<body class="bg-[#fcfdfe] text-slate-900">
  <div id="root">
    <!-- Pixenox loading skeleton — replaced by React on mount -->
    <div id="pixenox-loader" style="font-family:Inter,ui-sans-serif,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:1rem;background:#fcfdfe">
      <div style="width:3rem;height:3rem;border:3px solid #e2e8f0;border-top-color:#6c5ce7;border-radius:50%;animation:pxspin .8s linear infinite"></div>
      <p style="font-size:.875rem;font-weight:600;color:#94a3b8;letter-spacing:.05em">PIXENOX</p>
      <style>
        @keyframes pxspin{to{transform:rotate(360deg)}}
        .dark #pixenox-loader{background:#0f172a}
        .dark #pixenox-loader p{color:#64748b}
        .dark #pixenox-loader div:first-child{border-color:#334155;border-top-color:#6c5ce7}
      </style>
    </div>
  </div>
<script>
  // Capture install prompt event
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    window.deferredPWAPrompt = e;
    window.dispatchEvent(new CustomEvent('pwa-install-available'));
  });

  // Track successful installation
  window.addEventListener('appinstalled', function() {
    window.deferredPWAPrompt = null;
    window.dispatchEvent(new CustomEvent('pwa-installed'));
  });
</script>
<script type="module" src="/src/index.tsx"></script>
</body>
</html>
